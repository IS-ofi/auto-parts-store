# Тестове середовище (npm test піднімає його сам). Ізоляція (РПЗнП 7.11):
#  - окремий compose-проєкт `autoparts-test` зі своєю мережею;
#  - порти публікуються на ВИПАДКОВИЙ порт 127.0.0.1 (без зсуву 5433/5434 і без конфліктів із dev-БД);
#  - дані в tmpfs: після `down` нічого не лишається.
services:
  # Standalone: транзакцій немає → шлях «умовні списання + компенсація» (adr5, варіант 3).
  mongo:
    image: mongo:7
    ports: ['127.0.0.1::27017']
    tmpfs: ['/data/db']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)']
      interval: 2s
      timeout: 5s
      retries: 30

  # Одновузловий replica set: транзакції доступні → шлях withTransaction (adr5, варіант 2).
  mongo-rs:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports: ['127.0.0.1::27017']
    tmpfs: ['/data/db']
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { quit(rs.status().myState === 1 ? 0 : 1) } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }); quit(1) }"
      interval: 2s
      timeout: 5s
      retries: 30
